apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: usuarios-pgdata
  namespace: microservicios
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios-db
  namespace: microservicios
spec:
  selector:
    app: usuarios-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-db
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios-db
  template:
    metadata:
      labels:
        app: usuarios-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: usuarios_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: usuarios-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: usuarios-password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - usuarios_user
                - -d
                - usuarios_db
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: inicializacion
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: usuarios-pgdata
        - name: inicializacion
          configMap:
            name: usuarios-init
---
