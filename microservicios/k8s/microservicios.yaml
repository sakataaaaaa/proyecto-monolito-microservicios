apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
  namespace: microservicios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
        - name: pedidos
          image: pedidos:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DB_HOST
              value: pedidos-db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: pedidos_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: pedidos-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: pedidos-password
            - name: USUARIOS_URL
              value: "http://usuarios:3001"
            - name: PRODUCTOS_URL
              value: "http://productos:3002"
