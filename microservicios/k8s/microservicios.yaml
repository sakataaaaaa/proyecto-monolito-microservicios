apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
  namespace: microservicios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usuarios
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      containers:
        - name: usuarios
          image: usuarios:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: usuarios-db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: usuarios_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: usuarios-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: usuarios-password
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
  namespace: microservicios
spec:
  type: NodePort
  selector:
    app: usuarios
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 31001
---
